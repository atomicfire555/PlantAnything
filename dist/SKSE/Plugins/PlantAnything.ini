; ================================================================
;  Plant Anything - settings
;
;  FERTILE SOIL (default): every ingredient / crop that grows on a plant
;  anywhere in your load order (vanilla, DLC, Creation Club, mods) becomes
;  plantable in Hearthfire fertile soil and in homestead mods that use the
;  same planter system. Activate the soil as usual - the list is just longer.
;
;  Documents\My Games\Skyrim Special Edition\SKSE\PlantAnything.log shows which
;  planter lists were found and everything that was added.
; ================================================================
[FertileSoil]

; Add all plantable items to fertile soil planter lists.
bPatchFertileSoil = true

; Also make ingredients that no plant gives (animal parts, salts, merchant-only items...)
; plantable. They grow as a placeholder plant named after the item. Needs PlantAnything.esp.
bSoilAllIngredients = true

; Plots planted with older versions may hold an invisible plant (a hanging garlic braid or
; dried herb bundle that spawned underground). Lift those up so they can be harvested.
bLiftBuriedPlants = true

; Planter item lists to leave untouched (e.g. a homestead's "herbs only" bed).
; Plugin|FormID of the *item* list, as shown in the log. Comma separated.
; Example: sSkipPlanterLists = SomeHomestead.esp|0x00000D62
sSkipPlanterLists =

[Sources]

; Include tree records that give produce (e.g. Juniper). Soil prefers a
; normal plant model whenever one exists.
bIncludeTrees = true

; Include food crops (cabbage, potato, leek, gourd, tomato...).
bIncludeFood = true

; Include non-food potions some mod plants give (rare).
bIncludePotions = false

[Exclusions]

; Plants defined in these plugins are ignored (comma separated).
; Example: sExcludedPlugins = SomeMod.esp, AnotherMod.esl
sExcludedPlugins =

; Items that should never be added: Plugin|FormID, comma separated.
; Use the FormID as shown in xEdit or the log (the load-order prefix is ignored).
; Example: sExcludedItems = Skyrim.esm|0x00012345, SomeMod.esl|0x00000801
sExcludedItems =

; ----------------------------------------------------------------
;  OPTIONAL: plant anywhere (off by default)
;  Sneak + drop an item from your inventory; it sprouts where it lands.
;  Regrows after fRegrowDays. Sneak + activate an already-harvested one
;  of these to uproot it.
; ----------------------------------------------------------------
[DropPlanting]

bEnableDropPlanting = false
bRequireSneak = true
bAllowInteriors = true
fRegrowDays = 3.0
fSproutDelaySeconds = 2.0
fSinkDepth = 2.0
bAllowUproot = true
bShowMessages = true

; When an ingredient comes from several plant models, pick one at random.
bRandomVariant = false
